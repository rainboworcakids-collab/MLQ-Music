    <style>

        :root { --box-bg: #f7ede3; --ribbon-color: #cb7b3c; --box-shadow: rgba(0,0,0,0.2); }

        .gift-box.opened { animation: fadeOutBox 0.5s forwards; pointer-events: none; }

        .box-body {

<body>
<div class="gift-container">
    <div class="gift-box" id="giftBox" onclick="openBox()">

        <div class="ribbon-left"></div>

        <div class="box-body"><div class="tissue-paper"></div></div>
        <div class="tag" id="tagText">แตะเพื่อเปิด</div>
    </div>
    <div class="greeting-card" id="greetingCard">
        <div id="cardContent">
            <div class="loading-spinner"></div>
            <p class="text-center text-stone-500 text-sm mt-2">กำลังโหลดซองเพลง...</p>
        </div>
    </div>
    <div id='playMainButton' class="hidden">
        <div class="stop-clock-container hidden">
            <div class="stop-clock-card"><div class="stop-clock-label">Stop Hr</div><button class="adj-btn" id="stopHrUp">+</button><span class="stop-clock-number" id="hours_stop">12</span><button class="adj-btn" id="stopHrDown">–</button><div class="stop-ampm" id="stopAMPM">AM</div></div>
            <div class="stop-clock-card"><div class="stop-clock-label">Stop Min</div><button class="adj-btn" id="stopMinUp">+</button><span class="stop-clock-number" id="minutes_stop">00</span><button class="adj-btn" id="stopMinDown">–</button></div>
            <div class="stop-clock-card"><div class="stop-clock-label">Stop Sec</div><button class="adj-btn" id="stopSecUp">+</button><span class="stop-clock-number" id="seconds_stop">00</span><button class="adj-btn" id="stopSecDown">–</button></div>
            <div class="stop-right-column"><button id="toggleTimerBtn" class="btn-timer btn-timer-off">⏻ Timer Off</button></div>
        </div>
        <div style="text-align: center; margin: 20px 0 10px;">
            <button id="playButton" class="btn-primary">
                <div class="btn-inner">
                    <img class="logo-icon" src="icons/icon-512x512.png" alt="MLQ-Music">
                    <h3 class="text-xl font-bold mt-4"><i id="playIcon" class="fas fa-play"></i></h3>
                    <div class="btn-text">
                        <span class="btn-small-text">ฟังเพลง</span>
                        <h2 class="modal-title">DNA ของขวัญ</h2>
                    </div>
                    <div id="timerStatus" class="timer-status stop-ampm bg-emerald-50 p-2 rounded-xl mb-1"></div>
                </div>
            </button>

</div>

<script>
    // ป้องกัน event ซ้ำ
    if (window.AudioController && window.AudioController.handleCombinedDNA) {
        const originalHandle = window.AudioController.handleCombinedDNA;
        window.AudioController.handleCombinedDNA = function(defaultDNA, customDNA) {
            if (this.isPlaying) { console.warn('⛔ Blocked duplicate handleCombinedDNA'); return; }
            return originalHandle.call(this, defaultDNA, customDNA);
        };
    }
    if (window.MusicPrerenderController) {
        if (window.MusicPrerenderController.stop) window.MusicPrerenderController.stop = function() {};
        if (window.MusicPrerenderController.initialize) window.MusicPrerenderController.initialize = function() {};
    }
    
    let boxOpened = false;
    
    // ========== Voice Note Functions ==========
    let voicePostAudio = null;      // HTMLAudioElement สำหรับ post voice (ไม่ต้องใช้ Tone)
    let voicePrePlayer = null;      // Tone.Player สำหรับ pre voice
    
    // ใช้ Tone.js เล่น voice pre (เพื่อใช้ AudioContext เดียวกับ DNA Music)
    async function playVoicePreWithTone(url) {
        if (!url) return;
        // ตรวจสอบว่า Tone context กำลัง run (หรือเริ่ม)
        if (Tone.context.state !== 'running') {
            await Tone.start();
            await Tone.context.resume();
        }
        return new Promise((resolve, reject) => {
            // สร้าง Player และต่อเข้ากับ Destination โดยตรง
            const player = new Tone.Player(url, () => {
                // loaded แล้ว
                player.onstop = () => {
                    player.dispose();
                    voicePrePlayer = null;
                    resolve();
                };
                player.start();
                voicePrePlayer = player;
            }).toDestination();
            player.onerror = (err) => {
                console.error('Tone.Player error:', err);
                player.dispose();
                voicePrePlayer = null;
                reject(err);
            };
        });
    }
    
    // เล่น voice post ด้วย HTMLAudioElement (หลัง DNA จบ, ไม่ต้องใช้ Tone เพื่อไม่ให้รบกวน)
    function playVoicePostHtml(url) {
        if (!url) return;
        if (voicePostAudio) {
            voicePostAudio.pause();
            voicePostAudio = null;
        }
        const audio = new Audio(url);
        voicePostAudio = audio;
        audio.onended = () => {
            voicePostAudio = null;
        };
        audio.play().catch(e => console.warn('Voice post error', e));
    }
    
    function stopVoicePost() {
        if (voicePostAudio) {
            voicePostAudio.pause();
            voicePostAudio.currentTime = 0;
            voicePostAudio = null;
        }
    }
    
    function setVoiceStatusMessage(msg) {
        const timerEl = document.getElementById('timerStatus');
        if (timerEl && msg) {
            const originalText = timerEl.textContent;
            timerEl.textContent = msg;
            setTimeout(() => {
                if (timerEl.textContent === msg) timerEl.textContent = originalText;
            }, 2000);
        }
    }
    
    async function openBox() {
        const box = document.getElementById('giftBox');
        if (box.classList.contains('opening') || box.classList.contains('opened')) return;
        // เริ่ม AudioContext (ถ้ายังไม่เริ่ม)
        if (Tone.context.state !== 'running') {
            await Tone.start();
            await Tone.context.resume();
        }
        box.classList.add('opening');
        setTimeout(() => { box.classList.add('opened'); box.classList.remove('opening'); }, 1200);
        document.getElementById('tagText').textContent = 'เปิดแล้ว! 🎉';
        if (!boxOpened && window.musicDNAReady && window.currentSongDNA) {
            boxOpened = true;
            
            // เล่น voice pre ถ้ามี (ใช้ Tone.js)
            if (window.currentSongDNA.voice_url && window.currentSongDNA.voice_position === 'pre') {
                setVoiceStatusMessage('🎙️ กำลังเล่นข้อความเสียง...');
                try {
                    await playVoicePreWithTone(window.currentSongDNA.voice_url);
                } catch(e) {
                    console.warn('Voice pre with Tone failed', e);
                }
                setVoiceStatusMessage('');
            }
            
            // เริ่ม DNA Music ทันที (AudioContext ทำงานอยู่แล้ว)
            if (window.AudioController) {
                if (window.AudioController.isPlaying) window.AudioController.stop();
                window.AudioController.handleCombinedDNA(window.currentSongDNA.defaultDNA, window.currentSongDNA.customDNA);
                window.AudioController.play();
            }
        }
    }
    
    function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
    
    // ========== getQrDataUrl ที่เสถียร ==========
    async function getQrDataUrl(text, size = 180) {
        return new Promise((resolve) => {
            const div = document.createElement('div');
            try {
                new QRCode(div, {
                    text: text,
                    width: size,
                    height: size,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
                let attempts = 0;
                const maxAttempts = 10;
                const check = () => {
                    const img = div.querySelector('img');
                    const canvas = div.querySelector('canvas');
                    if (img && img.src && img.src.startsWith('data:')) {
                        resolve(img.src);
                        return;
                    }
                    if (canvas) {
                        try {
                            const dataUrl = canvas.toDataURL();
                            if (dataUrl && dataUrl.startsWith('data:image')) {
                                resolve(dataUrl);
                                return;
                            }
                        } catch(e) {}
                    }
                    attempts++;
                    if (attempts < maxAttempts) {
                        setTimeout(check, 100);
                    } else {
                        console.warn('QR generation timeout after', maxAttempts * 100, 'ms');
                        resolve('');
                    }
                };
                setTimeout(check, 100);
            } catch(e) {
                console.warn("QR generation error", e);
                resolve('');
            }
        });
    }
    
    // Main
    document.addEventListener('DOMContentLoaded', async () => {
        console.log('🎁 play_giftcard V3.9.1 - ใช้ Tone.js สำหรับ Voice Pre แก้ไขปัญหาขาดหาย');
        
        await new Promise(resolve => {
            const check = setInterval(() => {
                if (window.AppMainController && window.DataContract && window.FormPsychomatrixController && 
                    window.MusicStylesController && window.MusicPresetCache) {
                    clearInterval(check); resolve(true);
                }
            }, 100);
        });
        try {
            if (window.AppMainController) window.AppMainController.initialize();
            if (window.FormUIController) window.FormUIController.initialize();
            if (window.MusicStylesController) window.MusicStylesController.initialize();
            if (window.AudioController) window.AudioController.initialize();
        } catch(e) { console.warn(e); }
        
        const supabase = window.supabaseClient || window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        const shortId = new URLSearchParams(window.location.search).get('song');
        if (!shortId) { document.getElementById('cardContent').innerHTML = '<p class="text-red-500">❌ ไม่พบซองเพลง</p>'; return; }
        
        let song = null;
        const { data: direct } = await supabase.from('user_songs').select('*').eq('short_id', shortId).maybeSingle();
        if (direct) song = direct;
        if (!song) { document.getElementById('cardContent').innerHTML = '<p class="text-red-500">❌ ไม่พบซอง</p>'; return; }
        supabase.from('user_songs').update({ views_count: (song.views_count||0)+1 }).eq('id', song.id).then();
        
        const payload = song.payload || {};
        const userData = payload.user_data || {};
        let receiverName = payload.receiverName || '';
        let senderName = payload.senderName || '';
        if (!receiverName && userData.fullName) receiverName = userData.fullName;
        if (!receiverName && userData.nickname) receiverName = userData.nickname;
        if (!senderName && payload.sender) senderName = payload.sender;
        if (!senderName && userData.senderName) senderName = userData.senderName;
        
        const templateId = song.card_template_id || 'classic';
        const customMsg = payload.custom_message || null;
        const imageUrl = song.image_url || null;
        let template = null;
        try {
            const { data: tmpl } = await supabase.from('card_templates').select('*').eq('id', templateId).single();
            if (tmpl) template = tmpl;
        } catch(e) {}
        if (!template) template = { bg_gradient: 'linear-gradient(145deg, #f9f3e9, #fff0e0)', icon: '🎵', default_message: 'ซองดนตรีถึงคุณ' };
        
        let defaultDNA = null, customDNA = { sequence: [], tempo: 90, instruments: [] };
        if (payload.musicDNA && payload.musicDNA.defaultDNA && payload.musicDNA.defaultDNA.sequence) {
            defaultDNA = payload.musicDNA.defaultDNA;
            customDNA = payload.musicDNA.customDNA || customDNA;
        } else {
            defaultDNA = { sequence: [{ note: "C4", duration: "4n", time: 0 }], instruments: ["piano"], config: { bpm: 80 } };
        }
        if (!defaultDNA || !defaultDNA.sequence) { document.getElementById('cardContent').innerHTML = '<p class="text-red-500">DNA error</p>'; return; }
        if (!defaultDNA.instruments) defaultDNA.instruments = ["piano"];
        
        // ========== Voice Note data ==========
        const voiceUrl = payload.voice_url || null;
        const voicePosition = payload.voice_position || null;
        
        window.currentSongDNA = { 
            defaultDNA, 
            customDNA,
            voice_url: voiceUrl,
            voice_position: voicePosition
        };
        window.musicDNAReady = true;
        
        const playUrl = song.play_url || `${window.location.origin}${window.location.pathname}?song=${shortId}`;
        const edition = payload.edition || 'premium';
        const themeClass = payload.theme_class || 'theme-classic';
        
        // โหลด CSS ตาม edition
        if (typeof window.loadEditionCSS === 'function') {
            window.loadEditionCSS(edition);
        } else {
            const oldLink = document.querySelector('link[data-edition-css]');
            if (oldLink) oldLink.remove();
            const cssFile = `css/gift-card-${edition}.css?v=6.0`;
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = cssFile;
            link.setAttribute('data-edition-css', '');
            document.head.appendChild(link);
            console.log(`🎨 โหลด CSS edition: ${edition} (${cssFile})`);
        }
        
        // QR
        let qrDataUrl = '';
        try {
            qrDataUrl = await getQrDataUrl(playUrl, 180);
        } catch(e) { console.warn("QR generation failed", e); }
        
        const cardContainer = document.getElementById('cardContent');
        if (typeof window.renderMLQGiftCard === 'function') {
            window.renderMLQGiftCard(cardContainer, {
                bgGradient: template.bg_gradient,
                bgImageUrl: template.background_image_url || null,
                icon: template.icon,
                receiverName: receiverName,
                message: customMsg || template.default_message,
                imageUrl: imageUrl,
                senderName: senderName,
                themeClass: themeClass,
                qrDataUrl: qrDataUrl,
                showBadge: false
            });
        } else {
            console.error('renderMLQGiftCard not found');
        }
        
        // แสดงปุ่มควบคุม
        const playMainButton = document.getElementById('playMainButton');
        playMainButton.classList.remove('hidden');   
        
        // เรื่องราว และ ปุ่ม DNA Story + Register
        const destinyBlueprint = payload.destinyBlueprint || null;
        const storyHtml = destinyBlueprint ? `<div class="story-text">✨ ${escapeHtml(destinyBlueprint).replace(/\n/g,'<br>')}</div>` 
            : `<div class="story-text">✨ เสียงเพลงจากพิมพ์เขียวชีวิตของคุณ</div>`;
        const detailHtml = `
            <div id="detailSection" class="detail-section">
                ${storyHtml}
                <div class="insight-card">
                    <div class="dna-badge">🧬 MUSIC DNA</div>
                    <p class="text-sm mt-2">Life Path ${payload.numerology?.lifePath || '?'} / Destiny ${payload.numerology?.destiny || '?'}</p>
                </div>
            </div>
        `;
        cardContainer.insertAdjacentHTML('beforeend', detailHtml);
        
        const actionRow = `
            <div class="action-row">
                <button id="toggleDetailBtn" class="story-trigger-btn"><i class="fas fa-book-open"></i> Music DNA Story</button>
                <a href="https://mission-mlq.com" target="_blank" class="btn-register-small"><i class="fas fa-music"></i> Free! Music-MLQ</a>
            </div>
        `;
        cardContainer.insertAdjacentHTML('beforeend', actionRow);
        
        document.getElementById('toggleDetailBtn')?.addEventListener('click', () => {
            document.getElementById('detailSection')?.classList.toggle('open');
        });
        
        // ========== Voice Post: เล่นเมื่อ DNA Music หยุด (ใช้ HTMLAudioElement) ==========
        window.addEventListener('music-stopped-event', () => {
            if (window.currentSongDNA?.voice_url && window.currentSongDNA?.voice_position === 'post') {
                console.log('Playing post voice note');
                playVoicePostHtml(window.currentSongDNA.voice_url);
            }
        });
        
        // ========== Timer System (คงเดิม) ==========
        let stopHours12 = 12, stopMinutes = 0, stopSeconds = 0, stopIsPM = false, timerActive = false;
        const LIMIT_SEC = 15;
        const toggleBtn = document.getElementById('toggleTimerBtn');
        const timerStatusEl = document.getElementById('timerStatus');
        const inviteModal = document.getElementById('inviteModal');
        if (inviteModal) inviteModal.style.display = 'none';
        
        function getStopHours24() {
            if (stopHours12 === 12) return stopIsPM ? 12 : 0;
            return stopIsPM ? stopHours12 + 12 : stopHours12;
        }
        function updateStopDisplay() {
            const elH = document.getElementById('hours_stop');
            const elM = document.getElementById('minutes_stop');
            const elS = document.getElementById('seconds_stop');
            const elA = document.getElementById('stopAMPM');
            if (elH) elH.textContent = String(stopHours12).padStart(2, '0');
            if (elM) elM.textContent = String(stopMinutes).padStart(2, '0');
            if (elS) elS.textContent = String(stopSeconds).padStart(2, '0');
            if (elA) elA.textContent = stopIsPM ? 'PM' : 'AM';
        }
        document.getElementById('stopHrUp')?.addEventListener('click', () => { if (timerActive) return;
            if (stopHours12 === 11) { stopHours12 = 12; stopIsPM = !stopIsPM; }
            else if (stopHours12 === 12) stopHours12 = 1;
            else stopHours12++;
            updateStopDisplay();
        });
        document.getElementById('stopHrDown')?.addEventListener('click', () => { if (timerActive) return;
            if (stopHours12 === 12) { stopHours12 = 11; stopIsPM = !stopIsPM; }
            else if (stopHours12 === 1) stopHours12 = 12;
            else stopHours12--;
            updateStopDisplay();
        });
        document.getElementById('stopMinUp')?.addEventListener('click', () => { if (timerActive) return; stopMinutes = (stopMinutes + 1) % 60; updateStopDisplay(); });
        document.getElementById('stopMinDown')?.addEventListener('click', () => { if (timerActive) return; stopMinutes = (stopMinutes - 1 + 60) % 60; updateStopDisplay(); });
        document.getElementById('stopSecUp')?.addEventListener('click', () => { if (timerActive) return; stopSeconds = (stopSeconds + 1) % 60; updateStopDisplay(); });
        document.getElementById('stopSecDown')?.addEventListener('click', () => { if (timerActive) return; stopSeconds = (stopSeconds - 1 + 60) % 60; updateStopDisplay(); });
        function updateTimerUI() {
            if (!toggleBtn) return;
            if (timerActive) {
                toggleBtn.textContent = '⏻ Timer On';
                toggleBtn.className = 'btn-timer btn-timer-on';
            } else {
                toggleBtn.textContent = '⏻ Timer Off';
                toggleBtn.className = 'btn-timer btn-timer-off';
                timerStatusEl.textContent = '⏳ ' + LIMIT_SEC;
            }
        }
        window.forceStopAllMusic = function() {
            console.log('[forceStopAllMusic] Stopping all audio...');
            const ac = window.AudioController;
            if (ac && ac.isPlaying) ac.stop();
            if (window.MusicPrerenderController?.stop) window.MusicPrerenderController.stop();
            if (window.Tone) {
                Tone.Transport.cancel(0);
                Tone.Transport.stop();
                Tone.Transport.position = 0;
            }
            const playIcon = document.getElementById('playIcon');
            if (playIcon) playIcon.className = 'fas fa-play';
            timerActive = false;
            updateTimerUI();
        };
        function formatCountdown(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }
        function updateStopTimeFromNow() {
            const now = new Date();
            let targetSeconds = now.getTime() / 1000 + LIMIT_SEC;
            let targetDate = new Date(targetSeconds * 1000);
            let hrs24 = targetDate.getHours(), mins = targetDate.getMinutes(), secs = targetDate.getSeconds();
            stopIsPM = hrs24 >= 12;
            let hour12 = hrs24 % 12;
            stopHours12 = hour12 === 0 ? 12 : hour12;
            stopMinutes = mins;
            stopSeconds = secs;
            updateStopDisplay();
        }
        function updateClock() {
            const now = new Date();
            const hrs24 = now.getHours(), min = now.getMinutes(), sec = now.getSeconds();
            if (timerActive) {
                const targetHrs24 = getStopHours24();
                if (hrs24 === targetHrs24 && min === stopMinutes && sec === stopSeconds) {
                    console.log('⏰ Timer matched! Force stopping music.');
                    if (inviteModal) inviteModal.style.display = 'flex';
                    forceStopAllMusic();
                    return;
                }
                let target = new Date(now);
                target.setHours(targetHrs24, stopMinutes, stopSeconds, 0);
                if (target <= now) target.setDate(target.getDate() + 1);
                const totalSec = Math.ceil((target - now) / 1000);
                timerStatusEl.textContent = `⏳ ${formatCountdown(totalSec)}`;
            } else {
                timerStatusEl.textContent = '⏳ ' + LIMIT_SEC;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();
        updateStopTimeFromNow();
        updateTimerUI();
        window.addEventListener('playbackStateChanged', (e) => {
            const isPlaying = e.detail?.isPlaying;
            if (isPlaying === true) {
                timerActive = true;
                updateTimerUI();
                updateStopTimeFromNow();
                updateClock();
                console.log('[Timer] Music started');
            } else if (isPlaying === false) {
                timerActive = false;
                updateTimerUI();
                console.log('[Timer] Music stopped');
            }
        });
        window.addEventListener('music-stopped-event', () => {
            timerActive = false;
            updateTimerUI();
        });
        
        const playBtn = document.getElementById('playButton');
        if (playBtn) {
            playBtn.addEventListener('click', () => {
                window.location.reload();
            });
        }
        
        document.getElementById('toggleDetailBtn')?.addEventListener('click', () => {
            document.getElementById('detailSection')?.classList.toggle('open');
        });
        setTimeout(() => openBox(), 600);
    });
</script>

<div id="inviteModal">
    <div style="background:linear-gradient(145deg, #fff8f0, #ffe6cc); max-width:340px; width:90%; border-radius:32px; padding:24px; text-align:center;">
        <div style="font-size:3rem;">🎧✨</div>
        <h2 style="font-size:1.6rem;">หมดเวลาทดลองฟัง</h2>
        <p style="color:#5a3a2a;">คลิกปุ่มด้านล่างเพื่อรับประสบการณ์เต็มรูปแบบ</p>
        <a href="https://mlq-music.com" target="_blank" style="display:inline-block; background:#f59e0b; color:white; padding:12px 24px; border-radius:40px;">✨ ลงทะเบียน รับเพลงเต็ม</a>
        <button id="closeInviteBtn" style="background:none; border:none; margin-top:20px; cursor:pointer;">ปิด</button>
    </div>
</div>
<script>
    document.getElementById('closeInviteBtn')?.addEventListener('click', () => {
        document.getElementById('inviteModal').style.display = 'none';
    });
</script>
</body>
</html>
